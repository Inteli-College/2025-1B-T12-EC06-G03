spring.application.name=athenas

# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_URL}:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase Storage
supabase.project.url=https://efinfalxxeaqfkvboewx.supabase.co
supabase.bucket.name=img-projects
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}

# JWT secret key (para sua autenticação via JWT)
jwt.secret=${JWT_SECRET:defaultSecretKey}

# Limite de conexões do pool HikariCP
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
