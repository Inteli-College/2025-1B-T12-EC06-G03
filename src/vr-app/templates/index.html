<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="https://glitch.com/favicon.ico" />
  <title>Drone Stream VR</title>

  <!-- A-Frame core -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- WebXR AR support -->
  <script src="https://unpkg.com/aframe-xrweb@latest/dist/aframe-xrweb.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../static/css/style.css">

  <!-- Custom VR Components -->
  <script src="../static/js/vr-components.js"></script>
</head>

<body>
  <div id="overlay" style="display: none;"></div>

  <a-scene renderer="colorManagement: true; antialias: true" webxr="optionalFeatures: local-floor;"
    vr-mode-ui="enabled: true"
    xrweb="mode: immersive-ar; requiredFeatures: hit-test; optionalFeatures: dom-overlay; overlayElement: #overlay; hand-tracking;"
    xr-mode-ui="enabled: true; enterAREnabled: true; XRMode: xr;" joystick-controller joystick-debug-display embedded>

    <!-- Assets management section -->
    <a-assets>
      <video id="videoStream" autoplay loop muted crossorigin="anonymous" playsinline preload="none">
        <source src="http://10.140.0.11:5556/video" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </a-assets>

    <!-- Camera setup with hand tracking controls -->
    <a-camera position="0 1.6 0" look-controls="enabled: true; pointerLockEnabled: true"
      wasd-controls="acceleration: 50"></a-camera>

    <!-- Lights to illuminate objects -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" position="1 3 1" color="#ffffff" intensity="0.6"></a-light>

    <!-- Interactive Video Stream Screen -->
    <a-entity id="videoScreen" position="0 2 -2" rotation="0 0 0" keyboard-controls class="interactive"
      simple-vr-interaction>
      <a-plane width="1.5" height="1.125" material="src: #videoStream; transparent: false; shader: flat"
        geometry="primitive: plane">
      </a-plane>
    </a-entity>

    <!-- Joystick Status Text -->
    <a-entity id="joystickStatusText" position="0 3.5 -2">
      <a-text id="statusText" value="Aguardando entrada do joystick..." position="0 0 0" align="center" color="white"
        font="roboto" width="8">
      </a-text>
    </a-entity>

    <!-- Hand Tracking Controls with VR Gamepad Support -->
    <a-entity id="left-controller" oculus-touch-controls="hand: left" position="-0.5 1.6 -0.5"
      joystick-controls="hand: left; debugDisplay: true"></a-entity>

    <!-- Controle direito com acesso ao gamepad (baseado no exemplo fornecido) -->
    <a-entity id="right-controller" oculus-touch-controls="hand: right" gamepad-listener tracked-controls></a-entity>

    <!-- Cubo que vai se mover com o joystick (similar ao exemplo) -->
    <a-box id="cube" position="2 1.5 -3" color="#4CC3D9" width="0.5" height="0.5" depth="0.5"></a-box>

    <!-- Instructions panel -->
    <a-entity id="instructionsPanel" position="-3 1.5 -1" rotation="0 30 0">
      <a-plane width="2.5" height="2.2" color="#333333" opacity="0.8">
        <a-text value="CONTROLES:" position="-1.15 0.6 0.01" color="white" font="roboto" width="6"></a-text>

        <!-- VR Gamepad Controls -->
        <a-text value="CONTROLE VR:" position="-1.15 0.4 0.01" color="#ff6600" font="roboto" width="5"></a-text>
        <a-text value="Joystick: Mover objetos" position="-1.15 0.2 0.01" color="white" font="roboto"
          width="4"></a-text>
        <a-text value="Botões: Ações diversas" position="-1.15 0.0 0.01" color="white" font="roboto" width="4"></a-text>

        <!-- Legacy Joystick Controls -->
        <a-text value="JOYSTICK PADRÃO:" position="-1.15 -0.1 0.01" color="#ff9900" font="roboto" width="5"></a-text>
        <a-text value="Analógico E: Mover objetos" position="-1.15 -0.3 0.01" color="white" font="roboto"
          width="4"></a-text>
        <a-text value="Analógico D: Mover câmera" position="-1.15 -0.45 0.01" color="white" font="roboto"
          width="4"></a-text>

        <!-- Screen Controls -->
        <a-text value="TECLADO:" position="-1.15 -0.6 0.01" color="#00ff00" font="roboto" width="5"></a-text>
        <a-text value="WASD + Q/E: Movimento" position="-1.15 -0.8 0.01" color="white" font="roboto" width="4"></a-text>
        <a-text value="Setas: Rotação" position="-1.15 -1.0 0.01" color="white" font="roboto" width="4"></a-text>
      </a-plane>
    </a-entity>
  </a-scene>
</body>

</html>
